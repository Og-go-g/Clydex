# ─────────────────────────────────────────────────────────────────────
# Clydex production compose.
#
# As of 2026-05-03 (commit chore/build-out-of-band) prod NO LONGER
# compiles images. Both `clydex-app` and `clydex-worker` are pulled
# from ghcr.io/og-go-g/* — built by .github/workflows/docker-build.yml
# on every push to main. This eliminates the build-time OOM that
# crashed Postgres four times in two weeks
# (memory: postgres_oom_protection.md).
#
# Deploy on prod is now:
#   git pull
#   docker compose pull
#   docker compose up -d
#
# DO NOT add `--build` on prod. The `build:` blocks below are kept,
# commented out, only as documentation of which Dockerfile target
# each image corresponds to. For local dev where you DO want to
# build, run:
#   docker build -t clydex-app:dev --target runner .
#   docker build -t clydex-worker:dev --target worker .
# and override the image: line via a docker-compose.override.yml.
# ─────────────────────────────────────────────────────────────────────

services:
  app:
    image: ghcr.io/og-go-g/clydex-app:latest
    pull_policy: always # always grab the freshest :latest on `up -d`
    # build:
    #   context: .
    #   target: runner
    container_name: clydex-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    healthcheck:
      # 127.0.0.1 explicitly — Alpine's wget resolves `localhost` to ::1 (IPv6),
      # but Next.js binds only to 0.0.0.0 (IPv4), giving false "unhealthy".
      #
      # /api/health (NOT /) so Postgres outages actually mark the container
      # unhealthy. Hitting / would render the marketing page without touching
      # the DB — exactly the gap that caused the 6-day silent outage on
      # 2026-04-19. The endpoint pings BOTH pools (main + history) and
      # returns 503 if either is down; wget --spider exits non-zero on
      # any HTTP status >= 400, which Docker reads as "unhealthy".
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: clydex-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  worker:
    image: ghcr.io/og-go-g/clydex-worker:latest
    pull_policy: always
    # build:
    #   context: .
    #   target: worker
    container_name: clydex-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    stop_grace_period: 60s
    healthcheck:
      # Worker writes /tmp/worker.healthy ONLY after a successful DB
      # heartbeat (see worker/index.ts heartbeatLoop). Heartbeat runs every
      # 15 s; a 60-second mtime ceiling means we mark unhealthy after 4
      # consecutive missed heartbeats — which only happens if either
      # the DB is gone or the Node process is wedged. Plain statSync
      # (the previous check) would let a worker that hasn't heart-beaten
      # in days look healthy as long as the file existed.
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker.healthy'); if (Date.now() - s.mtimeMs > 60000) { console.error('stale heartbeat (' + (Date.now()-s.mtimeMs) + 'ms)'); process.exit(1); }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - app
