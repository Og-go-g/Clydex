name: Build & push docker images

# Why this exists: building on the prod box (4 GB Hetzner CPX22) was the
# direct trigger for four separate Postgres OOM crashes between Apr 19
# and May 3, 2026 — `docker compose --build` peaks at ~1.5 GB and
# combined with PG's shared_buffers it pushed the box past total RAM,
# systemd memory-pressure killed the heaviest victim (PG), and the
# cluster ended up stuck in `deactivating` with the worker in a
# restart-loop. Memory: postgres_oom_protection.md.
#
# After this workflow ships, prod stops compiling. The deploy flow
# becomes:
#
#   git pull && docker compose pull && docker compose up -d
#
# (no `--build`). RAM upgrade to CPX32 already mitigates the symptom;
# this is the structural fix that removes the trigger entirely.
#
# CI builds two images per push to main:
#   - ghcr.io/og-go-g/clydex-app    (Dockerfile target: runner)
#   - ghcr.io/og-go-g/clydex-worker (Dockerfile target: worker)
#
# Tagged with both `latest` (for prod's compose pull) and the commit
# SHA (for explicit pinning / rollback).

on:
  push:
    branches: [main]
    # Skip image rebuild for changes that can't possibly affect the
    # built artifact — pure docs / SQL migrations / memory files.
    paths-ignore:
      - "**.md"
      - "memory/**"
      - "sql/**"
      - ".github/**"
      # Re-enable workflow itself by allowing this file to trigger:
      - "!.github/workflows/docker-build.yml"
  # Manual trigger from the Actions tab — useful after a paths-ignore
  # commit when you DO want a rebuild anyway.
  workflow_dispatch:

# GHCR push needs `packages: write`; reading repo content needs `read`.
permissions:
  contents: read
  packages: write

# Cancel an in-flight run if a newer commit lands on main — no point
# pushing a stale image after a fast follow-up commit.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Build both images in parallel; one failing doesn't kill the
      # other so we can still deploy a half-fix if needed (e.g. only
      # the app changed but worker had a transient registry hiccup).
      fail-fast: false
      matrix:
        include:
          - target: runner
            image: clydex-app
          - target: worker
            image: clydex-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-provisioned per workflow run; no manual
          # secret needed. Scoped to the repo's package namespace via
          # the `permissions: packages: write` block above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/og-go-g/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          # Hetzner CPX32 is x86_64 AMD; no need for multi-arch builds.
          # Pinning the platform also halves CI time vs default.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache (10 GB free quota per repo). After the
          # first build it should cut subsequent builds from ~4 min to
          # ~1-2 min. mode=max caches all intermediate layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
